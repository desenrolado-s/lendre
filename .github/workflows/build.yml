name: Test and build desktop apps
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
          else
            tag="v$(bash scripts/next-version.sh)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15
            target: macos-arm64
          - os: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run unit and integration tests
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Archive Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/Legenda
          cp target/release/Legenda dist/Legenda/Legenda
          tar -czf Legenda-${{ matrix.target }}.tar.gz -C dist Legenda
      - name: Archive macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/Legenda.app/Contents/MacOS
          cp target/release/Legenda dist/Legenda.app/Contents/MacOS/Legenda
          tar -czf Legenda-${{ matrix.target }}.tar.gz -C dist Legenda.app
      - name: Stage Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/release/Legenda.exe Legenda-${{ matrix.target }}.exe
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Legenda-${{ matrix.target }}
          path: Legenda-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Create release tag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists."
          else
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" -f sha="${RELEASE_SHA}"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: Legenda-*
          merge-multiple: true
          path: release-assets
      - name: Include release version in asset names
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          for file in Legenda-linux-x64.AppImage Legenda-linux-x64.tar.gz Legenda-macos-arm64.tar.gz Legenda-windows-x64.exe; do
            test -s "$file"
            case "$file" in
              *.tar.gz) mv "$file" "${file%.tar.gz}-${RELEASE_TAG}.tar.gz" ;;
              *) mv "$file" "${file%.*}-${RELEASE_TAG}.${file##*.}" ;;
            esac
          done
      - name: Validate packages and generate checksums
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          test -s "Legenda-linux-x64-${RELEASE_TAG}.AppImage"
          test -s "Legenda-linux-x64-${RELEASE_TAG}.tar.gz"
          test -s "Legenda-macos-arm64-${RELEASE_TAG}.tar.gz"
          test -s "Legenda-windows-x64-${RELEASE_TAG}.exe"
          sha256sum Legenda-* > SHA256SUMS.txt
      - name: Install zsync
        run: sudo apt-get update && sudo apt-get install -y zsync
      - name: Generate AppImage zsync update file
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          appimage="$(ls Legenda-linux-x64*.AppImage)"
          test -n "$appimage"
          url="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/$(basename "$appimage")"
          zsyncmake -u "$url" -o Legenda-linux-x64.AppImage.zsync "$appimage"
          test -s Legenda-linux-x64.AppImage.zsync
      - name: Publish all packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if ! jq -e '.isDraft == true' release-state.json >/dev/null; then
              echo 'Release already published; refusing to replace its files.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Legenda $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
